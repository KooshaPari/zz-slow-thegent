[workspace]
resolver = "3"
members = [
    "thegent-resources",
    "thegent-parser",
    "thegent-crypto",
    "thegent-shm",
    "thegent-git",
    "thegent-discovery",
    "thegent-cache",
    "thegent-hooks",
    "thegent-docs",
    "thegent-utils",
    "thegent-router",
    "thegent-maif",
    "thegent-shims",
    "thegent-zmx-interop",
    "thegent-zmx",
    "thegent-jsonl",
    "thegent-policy",
    "thegent-metrics",
    "thegent-fs",
    "thegent-offload",
    "thegent-tui",
    "thegent-memory",
    "thegent-subprocess",
    "thegent-plugin-host",
]
exclude = ["thegent-watcher", "harness-native"]

[workspace.dependencies]
# Pure-Rust git library (gitoxide). Preferred over git2/libgit2 for all new
# Rust crates. Use `max-performance-safe` for portable SIMD acceleration.
gix = { version = "0.82.0", default-features = false, features = ["max-performance-safe"] }
which = "8.0"
criterion = "0.8"
derive_more = "1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
glib = "0.20.0"
rand = "0.10.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
overflow-checks = false
