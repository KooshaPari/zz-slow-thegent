[package]
name = "thegent-cache-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Advanced two-tier caching layer with LRU + DashMap"

[lib]
name = "thegent_cache"
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = { version = "0.14.3", features = ["serde"] }
lru = "0.18.1"
dashmap = "7.0.0-rc2"
parking_lot = "0.12.3"
moka = { version = "0.12.10", optional = true, features = ["sync", "future"] }
scc = { version = "3.8.4", optional = true }
pyo3 = { version = "0.29", optional = true, features = ["abi3-py312", "extension-module"] }
[features]
default = ["moka"]
moka = ["dep:moka"]
scc = ["dep:scc"]
python = ["dep:pyo3"]
